name: Deploy PR Preview

on:
  workflow_run:
    workflows: ["Build PR Preview"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read PR number
        id: pr
        run: echo "number=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy to gh-pages subdirectory
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          target-folder: pr-${{ steps.pr.outputs.number }}
          clean: true

      - name: Post preview URL comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            ## Preview deployment

            | | |
            |---|---|
            | **URL** | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ steps.pr.outputs.number }}/ |
            | **Commit** | ${{ github.event.workflow_run.head_sha }} |
            | **Updated** | ${{ github.event.workflow_run.updated_at }} |

            > Demo mode — sample data, no backend required.

  cleanup-preview:
    name: Remove PR Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'

    steps:
      - name: Check gh-pages branch exists
        id: branch-check
        run: |
          if git ls-remote --heads \
               "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
               gh-pages | grep -q gh-pages; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.branch-check.outputs.exists == 'true'
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Delete preview directory
        if: steps.branch-check.outputs.exists == 'true'
        run: |
          if [ -d "pr-${{ github.event.number }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr-${{ github.event.number }}"
            git commit -m "chore: remove preview for PR #${{ github.event.number }}"
            git push
          fi

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          number: ${{ github.event.number }}
          message: |
            Preview removed (PR closed).
